name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal PeriHop.app
        run: ./build.sh

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent PeriHop.app PeriHop.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: PeriHop.zip
          generate_release_notes: true
          body: |
            Unsigned build — first launch needs right-click → Open (or
            System Settings → Privacy & Security → Open Anyway) to get past
            Gatekeeper. See the README for details.
